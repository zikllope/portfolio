name: Mise à jour automatique de la Veille Technologique
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  update-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collecte des flux
        run: python update_veille.py
      - name: Commit et push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Veille Bot]"
          git add articles.json veille_archive.json
          git diff --staged --quiet || (git commit -m "chore(veille): actualisation quotidienne" && git push)
